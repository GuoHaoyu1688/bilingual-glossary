[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "bilingual-glossary"
version = "0.1.0"
description = "Offline terminology management and bilingual consistency checks"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["rapidfuzz>=3,<4", "pypinyin>=0.55,<1", "defusedxml>=0.7,<1", "polib>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.16,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.11,<1", "httpx>=0.27,<1"]
[project.scripts]
gloss = "bilingual_glossary.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/bilingual_glossary"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
patch = ["subprocess"]
